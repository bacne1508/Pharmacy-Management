<!DOCTYPE html>
<html layout:decorate="~{layouts/layout}" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" lang="en">

<head>
	<meta charset="UTF-8">
	<title>Account Management</title>
	<!-- Introduce the CSS style file -->
	<script th:src="@{/js/components/PharmacityItem/PharmacityItem.js}"></script>
	<script th:src="@{/js/adminPharmacityManage/adminAccountManage.js}"></script>
	<!-- jQuery -->
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<!-- Bootstrap JS -->
	<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.6.0/js/bootstrap.bundle.min.js"></script>
</head>

<body>
	<div layout:fragment="body">
		<div th:replace="~{adminHeader :: mainHeader}"></div>
		<div class="main-container">
			<div class="nav-left-container"></div>
			<div class="content-container">
				<div class="page-content">
					<span class="title gray-text">Account Management</span>
					<button type="button" class="btn btn-primary" data-backdrop="static" data-toggle="modal"
						data-target="#addRoleModal"><i class="icon-plus-sign"></i> Add new account</button>
				</div>
				<div class="bg-content clearfix">
					<div data-toggle="collapse" data-target="#search-box" class="header-box">
						<h2 class="title-box">Search area</h2>
						<i class="fa fa-minus pull-right" aria-hidden="true"></i>
					</div>
					<div class="collapse show" id="search-box">
						<div class="content-box">
							<div class="account-search-list"></div>
						</div>
						<!-- button footer -->
						<div class="col-12 center">
							<div class="box-btn-footer">
								<a class="u-btn-grey u-btn-effect" id="btnClear"> <i class="fa fa-eraser"
										aria-hidden="true"></i>
									<span> Cancel</span>
								</a> <a class="u-btn-common u-btn-effect" id="btnSearch"> <i class="fa fa-search"
										aria-hidden="true"></i> <span>Search</span>
								</a>
							</div>
						</div>
					</div>
				</div>				
				<div class="bg-content clearfix" id="role-card">
					<div class="table-wrapper">
						<table class="table table-bordered table-striped">
							<thead>
								<tr>
									<th>User Name</th>
									<th>Password</th>
									<th>Role</th>
									<th>Edit</th>
									<th>Delete</th>
								</tr>
							</thead>
							<tbody id="role-table"></tbody>
						</table>
					</div>
				</div>
				<div id="userTableContainer"></div>
				<ul class="pagination" id="pagination"></ul>
			</div>
		</div>		
		<!--Delete the character prompt box-->
		<div class="modal fade" id="roleDelModal" tabindex="-1" role="dialog" aria-labelledby="roleDelModalLabel" aria-hidden="true">
		    <div class="modal-dialog">
		        <div class="modal-content">
		            <div class="modal-header">
		                <button type="button" class="close" data-dismiss="modal" aria-hidden="true">x</button>
		                <h4 class="modal-title" id="roleDelModalLabel">Delete the role</h4>
		            </div>
		            <div class="modal-body">Do you want to delete this role cruelly??</div>
		            <div class="modal-footer">
		                <button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
		                <button type="button" class="btn btn-danger" id="commitRoleDel">Confirm delete</button>
		            </div>
		        </div>
		    </div>
		</div>
		<!--Modify the character information form-->
		<div class="modal fade" id="editRoleModal" tabindex="-1" role="dialog" aria-labelledby="editRoleModalLabel">
		    <div class="modal-dialog" role="document">
		        <div class="modal-content">
		            <div class="modal-header">
		                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
		                <h4 class="modal-title" id="editRoleModalLabel">Modify the information</h4>
		            </div>
		            <div class="modal-body">
		                <form class="form-horizontal" role="form">
		                    <div class="form-group">
		                        <label class="col-sm-2 control-label" for="edit-usn-input">username</label>
		                        <div class="col-sm-10">
		                            <input type="text" class="form-control" id="edit-usn-input" placeholder="Please enter the new username">
		                        </div>
		                    </div>
		                    <div class="form-group">
		                        <label class="col-sm-2 control-label" for="edit-pwd-input">password</label>
		                        <div class="col-sm-10">
		                            <input type="text" class="form-control" id="edit-pwd-input" placeholder="Please enter the new password" readonly>
		                        </div>
		                    </div>
		                    <div class="form-group">
		                        <label class="col-sm-2 control-label" for="edit-auth-input">Role</label>
		                        <div class="col-sm-10">
		                            <select class="form-control" id="edit-auth-input"></select>
		                        </div>
		                    </div>
		                </form>
		            </div>
		            <div class="modal-footer">
		                <button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
		                <button type="button" class="btn btn-primary" id="edit-submit-btn">Submit</button>
		            </div>
		        </div>
		    </div>
		</div>
		<!--New character information form-->
		<div class="modal fade" id="addRoleModal" tabindex="-1" role="dialog" aria-labelledby="addRoleModalLabel">
		    <div class="modal-dialog" role="document">
		        <div class="modal-content">
		            <div class="modal-header">
		                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
		                <h4 class="modal-title" id="addRoleModalLabel">New role</h4>
		            </div>
		            <div class="modal-body">
		                <form class="form-horizontal" role="form">
		                    <div class="form-group">
		                        <label class="col-sm-2 control-label" for="add-usn-input">Username</label>
		                        <div class="col-sm-10">
		                            <input type="text" class="form-control" id="add-usn-input" placeholder="Please enter the user name">
		                        </div>
		                    </div>
		                    <div class="form-group">
		                        <label class="col-sm-2 control-label" for="add-pwd-input">Password</label>
		                        <div class="col-sm-10">
		                            <input type="text" class="form-control" id="add-pwd-input" value="123456">
		                        </div>
		                    </div>
		                    <div class="form-group">
		                        <label class="col-sm-2 control-label" for="add-auth-input">Role</label>
		                        <div class="col-sm-10">
		                            <select class="form-control" id="add-auth-input"></select>
		                        </div>
		                    </div>
		                </form>
		            </div>
		            <div class="modal-footer">
		                <button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
		                <button type="button" class="btn btn-primary" id="add-submit-btn">Submit</button>
		            </div>
		        </div>
		    </div>
		</div>
	</div>
</body>

</html>
