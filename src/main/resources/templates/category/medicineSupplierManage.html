<!DOCTYPE html>
<html layout:decorate="~{layouts/layout}" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" lang="en">

<head>
	<meta charset="UTF-8">
	<title>Supplier Management</title>
	<!-- Introduce the CSS style file -->
	<script th:src="@{/js/components/PharmacityItem/PharmacityItem.js}"></script>
	<script th:src="@{/js/category/medicineSupplierManage.js}"></script>
	<!-- jQuery -->
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<!-- Bootstrap JS -->
	<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.6.0/js/bootstrap.bundle.min.js"></script>
</head>

<body>
	<div layout:fragment="body">
		<div th:replace="~{adminHeader :: mainHeader}"></div>
		<div class="main-container">
			<div class="nav-left-container"></div>
			<div class="content-container">
				<div class="page-content">
					<span class="title gray-text">Supplier Management</span>
					<button type="button" class="btn btn-primary" data-backdrop="static" data-toggle="modal"
						data-target="#addRoleModal"><i class="icon-plus-sign"></i> Add new supplier</button>
				</div>
				<div class="bg-content clearfix">
					<div data-toggle="collapse" data-target="#search-box" class="header-box">
						<h2 class="title-box">Search area</h2>
						<i class="fa fa-minus pull-right" aria-hidden="true"></i>
					</div>
					<div class="collapse show" id="search-box">
						<div class="content-box">
							<div class="user-search-list"></div>
						</div>
						<!-- button footer -->
						<div class="col-12 center">
							<div class="box-btn-footer">
								<a class="u-btn-grey u-btn-effect" id="btnClear"> <i class="fa fa-eraser"
										aria-hidden="true"></i>
									<span> Cancel</span>
								</a> <a class="u-btn-common u-btn-effect" id="btnSearch"> <i class="fa fa-search"
										aria-hidden="true"></i> <span>Search</span>
								</a>
							</div>
						</div>
					</div>
				</div>
				<div class="bg-content clearfix" id="role-card">
					<div class="table-wrapper">
						<table class="table table-bordered table-striped">
							<thead>
								<tr>
									<th>Full Name</th>
									<th>Email</th>
									<th>Phone</th>
									<th>Address</th>
									<th>Created By</th>
									<th>Created Date</th>
									<th>Updated By</th>
									<th>Updated Date</th>
									<th>Edit</th>
									<th>Delete</th>
								</tr>
							</thead>
							<tbody id="user-table"></tbody>
						</table>
					</div>
				</div>
				<div id="userTableContainer"></div>
				<ul class="pagination" id="pagination"></ul>
			</div>
		</div>
		<!--Delete the character prompt box-->
		<div class="modal fade" id="roleDelModal" tabindex="-1" role="dialog" aria-labelledby="roleDelModalLabel"
			aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<button type="button" class="close" data-dismiss="modal" aria-hidden="true">x</button>
						<h4 class="modal-title" id="roleDelModalLabel">Delete the role</h4>
					</div>
					<div class="modal-body">Do you want to delete this supplier cruelly??</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
						<button type="button" class="btn btn-danger" id="commitRoleDel">Confirm delete</button>
					</div>
				</div>
			</div>
		</div>
		<!--Modify the character information form-->
		<div class="modal fade" id="editUserModal" tabindex="-1" role="dialog" aria-labelledby="editRoleModalLabel">
			<div class="modal-dialog" role="document">
				<div class="modal-content">
					<div class="modal-header">
						<button type="button" class="close" data-dismiss="modal" aria-label="Close"><span
								aria-hidden="true">&times;</span></button>
						<h4 class="modal-title" id="editRoleModalLabel">Modify the information</h4>
					</div>
					<div class="modal-body">
						<form class="form-horizontal" role="form">
							<div class="form-group">
								<label class="col-sm-2 control-label" for="edit-full-name-input">Full Name</label>
								<div class="col-sm-10">
									<input type="text" class="form-control" id="edit-full-name-input"
										placeholder="Please enter the new full name">
								</div>
							</div>
							<div class="form-group">
								<label class="col-sm-2 control-label" for="edit-email-input">Email</label>
								<div class="col-sm-10">
									<input type="text" class="form-control" id="edit-email-input"
										placeholder="Please enter the new email" disabled>
								</div>
							</div>
							<div class="form-group">
								<label class="col-sm-2 control-label" for="edit-phone-input">Phone</label>
								<div class="col-sm-10">
									<input type="text" class="form-control" id="edit-phone-input"
										placeholder="Please enter the new phone"></input>
								</div>
							</div>
							<div class="form-group">
								<label class="col-sm-2 control-label" for="edit-address-input">Address</label>
								<div class="col-sm-10">
									<input type="text" class="form-control" id="edit-address-input"
										placeholder="Please enter the new address"></input>
								</div>
							</div>
						</form>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
						<button type="button" class="btn btn-primary" id="edit-submit-btn">Submit</button>
					</div>
				</div>
			</div>
		</div>
		<!--New character information form-->
		<div class="modal fade" id="addRoleModal" tabindex="-1" role="dialog" aria-labelledby="addRoleModalLabel">
			<div class="modal-dialog" role="document">
				<div class="modal-content">
					<div class="modal-header">
						<button type="button" class="close" data-dismiss="modal" aria-label="Close"><span
								aria-hidden="true">&times;</span></button>
						<h4 class="modal-title" id="addRoleModalLabel">New medicine supplier</h4>
					</div>
					<div class="modal-body">
						<form class="form-horizontal" role="form">
							<div class="form-group">
								<label class="col-sm-2 control-label" for="add-full-name-input">Full Name</label>
								<div class="col-sm-10">
									<input type="text" class="form-control" id="add-full-name-input"
										placeholder="Please enter code">
								</div>									
							</div>
							<div class="form-group">

								<label class="col-sm-2 control-label" for="add-email-input">Email</label>
								<div class="col-sm-10">
									<input type="text" class="form-control" id="add-email-input"
										placeholder="Please enter name">
								</div>
							</div>
							<div class="form-group">
								<label class="col-sm-2 control-label" for="add-phone-input">Phone</label>
								<div class="col-sm-10">
									<input type="text" class="form-control" id="add-phone-input"
										placeholder="Please enter description"></input>
								</div>
							</div>
							<div class="form-group">
								<label class="col-sm-2 control-label" for="add-address-input">Address</label>
								<div class="col-sm-10">
									<textarea type="text" class="form-control" id="add-address-input"
										placeholder="Please enter description"></textarea>
								</div>
							</div>
						</form>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
						<button type="button" class="btn btn-primary" id="add-submit-btn">Submit</button>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
