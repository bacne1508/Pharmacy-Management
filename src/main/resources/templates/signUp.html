<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html>

<head>
	<title>Welcome</title>
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
	<link rel="stylesheet" href="your-styles.css"> <!-- CSS của bạn -->
	<!-- Google Fonts (ví dụ) -->
	<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
	<!-- Import css style file -->
	<link rel="stylesheet" type="text/css" th:href="@{/css/index.css}" />
	<link rel="stylesheet" type="text/css" th:href="@{/css/common.css}" />
	<link rel="stylesheet" type="text/css" th:href="@{/css/bootstrap.css}" />
	<link rel="stylesheet" type="text/css" th:href="@{/css/font-awesome.min.css}" />

	<script th:src="@{/js/jquery.js}"></script>
	<script th:src="@{/js/bootstrap.js}"></script>
	<script th:src="@{/js/request.js}"></script>
	<script th:src="@{/js/signUp.js}"></script>
</head>

<body>
	<div id="main-container">
		<div class="login-form-container">
			<form id="login-form">			
				<h3 class="title">Pharmacity Management System</h3>
				<div class="input-interval">
					<div class="input-group" id="basic-addon1">
						<span class="input-group-addon"><i class="fa fa-user"></i></span>
						<input id="signUp-name" type="text" class="form-control"
							placeholder="Please enter your username" aria-describedby="basic-addon1">
					</div>
					<p id="signUp-name-error" class="notice">Username length should be between 4 and 10 characters</p>
				</div>

				<div class="input-interval">
					<div class="input-group " id="basic-addon2">
						<span class="input-group-addon"><i class="fa fa-lock"></i></span>
						<input id="signUp-password" type="password" class="form-control"
							placeholder="Please enter your password" aria-describedby="basic-addon2">
						<i class="fa fa-eye toggle-password" id="togglePasswordIcon"></i>
					</div>
					<p id="signUp-password-error" class="notice">The password should be between 6 and 12 characters
						long.</p>
				</div>

				<div class="input-interval">
					<div class="input-group " id="basic-addon3">
						<span class="input-group-addon"><i class="fa fa-lock"></i></span>
						<input id="signUp-second-password" type="password" class="form-control"
							placeholder="Please confirm your password again" aria-describedby="basic-addon3">
						<!--<i class="fa fa-eye toggle-password" id="togglePasswordIcon"></i>-->
					</div>
					<p id="signUp-second-password-error" class="notice">Please enter your password again</p>
				</div>

				<div class="form-group">
					<p>Already have an account? <a href="/index">&nbsp;Sign in now</a>
				</div>

				<button id="signUp-btn" type="button" class="btn btn-primary input-interval btn-block">Register</button>
			</form>
		</div>
	</div>
</body>

</html>
